<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — CMU</title>
    <meta name="robots" content="noindex, follow">
    <script src="https://www.google.com/recaptcha/api.js?render=6Lc0Vz8sAAAAAOUH3njQ74YzthLcezzX1K_y4gi8"></script>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>

<main class="auth-container">
    <a class="auth-home" href="index.html">CMU — Página inicial</a>
    <h1>Entrar</h1>

    <form id="loginForm" method="post" novalidate>
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="E-mail" autocomplete="email">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Senha" autocomplete="current-password">

        <button id="loginBtn" type="submit">Entrar</button>

        <p id="message" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>

    <p class="link">
        Não tem conta? <a href="cadastro.html">Cadastrar</a>
    </p>
    <footer>
        <nav class="site-footer-links" aria-label="Links institucionais">
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
            <a href="privacidade.html">Política de Privacidade</a>
        </nav>
        &copy; 2026 CMU — Calculadora de Médias Universitárias. Todos os direitos reservados.
    </footer>
</main>

<script type="module" src="js/login.js"></script>
<script type="module" src="js/script.js"></script>
</body>
</html>
