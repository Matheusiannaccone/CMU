<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar conta — CMU</title>
    <script src="https://www.google.com/recaptcha/api.js?render=6Lc0Vz8sAAAAAOUH3njQ74YzthLcezzX1K_y4gi8"></script>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>

<main class="auth-container">
    <a class="auth-home" href="index.html">CMU — Página inicial</a>
    <h1>Criar conta</h1>

    <input type="text" id="nome" placeholder="Nome">
    <input type="text" id="sobrenome" placeholder="Sobrenome">
    <input type="date" id="nascimento">
    <select id="area">
        <option value="">Selecione a área</option>
        <option value="engenharias">Engenharias</option>
        <option value="tecnologos">Tecnólogos</option>
        <option value="saude">Saúde</option>
    </select>
    <select id="curso" disabled>
        <option value="">Selecione o curso</option>
    </select>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">

    <button id="registerBtn">Cadastrar</button>

    <p id="cadastroMessage"></p>

    <p class="link">
        Já possui conta? <a href="login.html">Entrar</a>
    </p>
    <footer>
        <nav class="site-footer-links" aria-label="Links institucionais">
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
            <a href="privacidade.html">Política de Privacidade</a>
        </nav>
        &copy; 2026 CMU — Calculadora de Médias Universitárias. Todos os direitos reservados.
    </footer>
</main>

<script type="module" src="js/cadastro.js"></script>
<script type="module" src="js/script.js"></script>
</body>
</html>
